<svg width="640" height="320" viewBox="0 0 640 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Template Library Illustration</title>
  <desc id="desc">Layered certificate templates and modular design blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1B3A" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#D9A938" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="card" x1="146" y1="68" x2="470" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF3FF"/>
    </linearGradient>
    <filter id="shadow" x="80" y="30" width="420" height="250" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0D1B3A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="320" rx="24" fill="url(#bg)"/>
  <rect x="26" y="26" width="588" height="268" rx="20" fill="#FFFFFF" fill-opacity="0.68"/>

