<svg width="640" height="320" viewBox="0 0 640 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Certificate Registry Illustration</title>
  <desc id="desc">Structured blocks and layered registry for certificate data management.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="600" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1B3A" stop-opacity="0.05"/>
