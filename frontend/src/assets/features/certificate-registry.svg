    </linearGradient>
    <filter id="shadow" x="80" y="70" width="490" height="210" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0D1B3A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="320" rx="24" fill="url(#bg)"/>
  <rect x="24" y="24" width="592" height="272" rx="20" fill="#FFFFFF" fill-opacity="0.7"/>

